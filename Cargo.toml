[package]
name = "venture"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.10"
pixels = "0.17.2"
winit = "0.30.13"

[lib]
crate-type = ["rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3.105"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "HtmlCanvasElement", "Blob", "BlobPropertyBag", "HtmlAudioElement", "Url"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
kira = "0.12.4"
