[package]
name = "venture"
version = "0.1.0"
edition = "2024"

[dependencies]
pixels = "0.17.2"
winit = "0.30.13"

[lib]
crate-type = ["rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
